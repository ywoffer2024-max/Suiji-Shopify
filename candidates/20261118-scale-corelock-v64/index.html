 <div class="review-title"><strong>SUIJI · v6.4 构图提案</strong>　内部可点预览，未修改正式站</div>
 <label>页面<select id="review-view"><option value="home">首页</option><option value="core">Core-Lock 与组照入口</option><option value="catalogue">混合商品列表</option><option value="product">戒指详情页</option></select></label>

<p class="review-description">看点：不同品类的主体大小不再归一；Core-Lock 用自然组合的两组图片；解释与可选商品在同一页。组照入口是独立商品图的布局占位，并非新拍的同场景合影；最终会替换为统一摄影的真实组照。原图的几何与反光复核仍在进行，不表示最终素材已验收。图片不是实物等比例尺。酒红仅为对比选项。</p>

const products=[{key:'ring',path:'/products/r01?variant=58009697222996',en:'Brushed Ring Base',fr:'Base de bague brossée',price:112,scale:1.38,equal:1.784,x:'.2%',y:'-3%'},{key:'hoop',path:'/products/h01-blue-hoop?variant=58042482229588',en:'Rounded Rectangle Hoops',fr:'Créoles rectangulaires arrondies',price:19,scale:1.25,equal:1.84,x:'1%',y:'-.3%'},{key:'collar',path:'/products/suiji-photo-20261109-collar-03?variant=58226332762452',en:'8-Link Collar',fr:'Tour de cou à 8 maillons',price:141,scale:1.02,equal:1.109,x:'.1%',y:'-.5%'},{key:'set',path:'/products/suiji-rpt-set-04-collar-charm?variant=58288354492756',en:'On the Terrace',fr:'En terrasse',price:238,scale:1,equal:1,x:'0%',y:'0%'}];
let language='en',view='home',size=54;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],t=(en,fr)=>language==='fr'?fr:en;
function href(path){return 'https://suijijewelry.com'+(language==='en'?'/en':'')+path;}
function image(file,width=960){return CDN+file+'?width='+width+'&quality=90';}
function card(p){return `<article class="product-card"><a class="card-photo" href="${href(p.path)}" ${p.key==='ring'?'data-view="product"':''} style="--scale:${p.scale};--equal:${p.equal};--x:${p.x};--y:${p.y}"><img src="${image(assets[p.key])}" alt="${p[language]}" width="800" height="1000" loading="lazy"></a><a class="product-name" href="${href(p.path)}" ${p.key==='ring'?'data-view="product"':''}>${p[language]}</a><p class="product-price">${new Intl.NumberFormat(language,{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(p.price)}</p><p class="product-status">${p.key==='set'?t('Set shown','Ensemble présenté'):t('Collection preview','Aperçu de la collection')}</p></article>`;}
function charmCard(c,small=false){const name=charmNames[c.path.split('/').pop()][language];return small?`<a href="${href(c.path)}" target="_blank" rel="noopener"><img src="${image(c.file,540)}" alt="${name}" width="540" height="675" loading="lazy"><span>${name}</span></a>`:`<article class="product-card"><a class="card-photo" href="${href(c.path)}" target="_blank" rel="noopener" style="--scale:1.08;--equal:1.72;--x:-1.5%;--y:-4%"><img src="${image(c.file)}" alt="${name}" width="800" height="1000" loading="lazy"></a><a class="product-name" href="${href(c.path)}">${name}</a><p class="product-status">${t('See the exact piece','Voir les détails de la pièce')}</p></article>`;}
function shopCategories(){const list=[{key:'chain',en:'Necklaces',fr:'Colliers',path:'/collections/necklaces',file:'suiji-20261118-cross-a-silver-6761dde5bc5d.jpg',scale:.96},{key:'hoop',en:'Earrings',fr:'Boucles d’oreilles',path:'/collections/earrings',file:assets.hoop,scale:1.25},{key:'ring',en:'Rings',fr:'Bagues',path:'/collections/rings',file:assets.ring,scale:1.38},{key:'charm',en:'Charms',fr:'Ornements',path:'/collections/charms',file:charms[8].file,scale:1.08},{key:'bracelet',en:'Bracelets & bangles',fr:'Bracelets',path:'/collections/bracelets',file:assets.collar,scale:1.02},{key:'accessory',en:'Accessories',fr:'Accessoires',path:'/collections/extras',file:'suiji-20261117-fitting-03-01-light-blue-807bd6b7a507.jpg',scale:1.1}];return list.map(p=>`<a class="nav-category" href="${href(p.path)}" target="_blank" rel="noopener"><span class="nav-category-visual" style="display:block;--scale:${p.scale}"><img src="${image(p.file,720)}" alt="" width="720" height="900"></span><span class="nav-category-title">${p[language]}</span></a>`).join('');}
function group(kind,mode='link'){
 const base=kind==='bases',label=base?'Bases':t('Charms','Ornements');
 const pic=base?`<div class="group-photo"><img class="collar" src="${image(assets.collar,720)}" alt=""><img class="ring" src="${image(assets.ring,720)}" alt=""><img class="hoop" src="${image(assets.hoop,540)}" alt=""></div>`:`<div class="group-photo charms">${[charms[1],charms[4],charms[8]].map(c=>`<img src="${image(c.file,540)}" alt="">`).join('')}</div>`;
 const id=base?'base-range':'charm-range';
 const families=base?`<div class="family-links"><a href="${href('/collections/rings')}">${t('Rings','Bagues')}</a><a href="${href('/collections/earrings')}">${t('Earrings','Boucles d’oreilles')}</a><a href="${href('/collections/necklaces')}">${t('Necklaces','Colliers')}</a><a href="${href('/collections/bracelets')}">${t('Bracelets & bangles','Bracelets')}</a></div>`:'';
 return `<div data-group-slot="${kind}"><p class="placeholder-note">${t('Group photograph to come · layout placeholder','Photo de groupe à venir · maquette')}</p><a class="menu-picture-link" href="#${id}" data-core-range="${id}">${pic}<div class="menu-label"><span>${label}</span><span aria-hidden="true">↗</span></div></a>${mode==='page'?families:`<p class="menu-helper">${base?t('Start with the piece you wear.','Commencez par le bijou que vous portez.'):t('Change its expression.','Changez son expression.')}</p>`}</div>`;
}
function setView(next,scroll=true){view=next;$$('.view').forEach(n=>n.hidden=n.id!=='view-'+next);$('#review-view').value=next;$('#core-menu').open=false;$('#shop-menu').open=false;$('#mobile-menu').close();if(scroll)$('#canvas').scrollIntoView({block:'start',behavior:'auto'});}
function drawCatalogue(){const category=$('#category').value;const list=category==='all'?products:products.filter(p=>p.key===category);$('#catalogue-grid').innerHTML=(category==='charm'?charms:[]).map(c=>charmCard(c)).join('')+list.map(card).join('')+(category==='all'?charms.slice(0,4).map(c=>charmCard(c)).join(''):'');const count=category==='charm'?9:list.length+(category==='all'?4:0);$('#result-count').textContent=count+' '+t('pieces','pièces');}
function render(){
 const base=$('#base-range')||$('#core-base-grid'),charm=$('#charm-range')||$('#core-charm-grid');
 document.documentElement.lang=language;$$('[data-en]').forEach(n=>n.textContent=n.dataset[language]);$$('.live-link').forEach(a=>{a.href=href(a.dataset.path);a.target='_blank';a.rel='noopener';});$('#language-button').textContent=language==='en'?'FR':'EN';$('#language-button').setAttribute('aria-label',t('Passer en français','Switch to English'));$('#open-mobile').setAttribute('aria-label',t('Open menu','Ouvrir le menu'));$('#zoom-button').setAttribute('aria-label',t('Enlarge product image','Agrandir la photo'));$('#ring-main').alt=t('Blue brushed ring base','Base de bague brossée bleue');$('#zoom-image').alt=$('#ring-main').alt;$('#home-hero-image').alt=t('On the Terrace set with collar and oval charm','Ensemble En terrasse avec collier et ornement ovale');$('#home-grid').innerHTML=products.map(card).join('');base.innerHTML=products.filter(p=>p.key!=='set').map(card).join('');base.id='base-range';charm.innerHTML=charms.map(c=>charmCard(c)).join('');charm.id='charm-range';['desktop-groups','home-groups'].forEach(id=>$('#'+id).innerHTML=group('bases')+group('charms'));$('#core-groups').innerHTML=group('bases','page')+group('charms','page');$('#desktop-categories').innerHTML=shopCategories();$('#mobile-groups').innerHTML=group('bases')+group('charms')+'<h2 style="font-size:28px;margin-top:30px">'+t('Shop all','Tous les bijoux')+'</h2><div class="mobile-categories">'+shopCategories()+'</div>';$('#pairing-charms').innerHTML=charms.map(c=>charmCard(c,true)).join('');$('#home-hero-image').src=image(assets.set,1600);$('#ring-main').src=image(assets.ring,1600);$('#zoom-image').src=image(assets.ring,2400);$('#size-measure').textContent=size+' mm · Ø '+(size===54?'17.2':'18.1')+' mm';$('#review-language').value=language;drawCatalogue();}
$('#review-view').addEventListener('change',e=>setView(e.target.value));$('#review-language').addEventListener('change',e=>{language=e.target.value;render();});$('#review-device').addEventListener('change',e=>$('#canvas').classList.toggle('phone',e.target.value==='phone'));$('#review-color').addEventListener('change',e=>$('#canvas').classList.toggle('wine',e.target.value==='wine'));$('#review-scale').addEventListener('change',e=>$('#canvas').classList.toggle('all-equal',e.target.value==='equal'));$('#category').addEventListener('change',drawCatalogue);$('#language-button').addEventListener('click',()=>{language=language==='en'?'fr':'en';render();});$('#open-mobile').addEventListener('click',()=>$('#mobile-menu').showModal());$('#zoom-button').addEventListener('click',()=>$('#image-dialog').showModal());$('#guide-button').addEventListener('click',()=>$('#size-dialog').showModal());$$('[data-close-dialog]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));$$('[data-size]').forEach(b=>b.addEventListener('click',()=>{size=Number(b.dataset.size);$$('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#size-measure').textContent=size+' mm · Ø '+(size===54?'17.2':'18.1')+' mm';}));document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){e.preventDefault();setView(nav.dataset.view);}const range=e.target.closest('[data-core-range]');if(range){e.preventDefault();setView('core',false);document.getElementById(range.dataset.coreRange).scrollIntoView({block:'start',behavior:'auto'});}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){['core-menu','shop-menu'].forEach(id=>{const m=$('#'+id);if(m.open){m.open=false;m.querySelector('summary').focus();}});}});document.addEventListener('click',e=>{['core-menu','shop-menu'].forEach(id=>{if(!e.target.closest('#'+id))$('#'+id).open=false;});});render();
</script>
</body>
</html>
